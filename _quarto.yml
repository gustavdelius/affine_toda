project:
  type: book
  output-dir: _site

book:
  title: "Affine Toda field theory"
  subtitle: "A graduate introduction, leading into current research"
  author: "Gustav Delius"
  repo-url: https://github.com/gustavdelius/affine_toda
  output-file: affine-toda
  downloads: [pdf]
  reader-mode: true
  navbar:
    background: primary
  search:
    location: navbar
    type: textbox
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - part: part1-background/part.qmd
      chapters:
        - part1-background/01-introduction.qmd
        - part1-background/02-integrable-qft.qmd
        - part1-background/03-sine-gordon.qmd
        - part1-background/04-non-hermitian.qmd
    - part: part2-algebra/part.qmd
      chapters:
        - part2-algebra/05-root-systems.qmd
        - part2-algebra/06-affine-algebras.qmd
        - part2-algebra/07-quantum-groups.qmd
        - part2-algebra/08-r-matrices.qmd
    - part: part3-classical/part.qmd
      chapters:
        - part3-classical/09-lagrangian.qmd
        - part3-classical/10-solitons.qmd
        - part3-classical/11-reality.qmd
    - part: part4-real-coupling/part.qmd
      chapters:
        - part4-real-coupling/12-perturbation-theory.qmd
        - part4-real-coupling/13-simply-laced.qmd
        - part4-real-coupling/14-non-simply-laced.qmd
        - part4-real-coupling/15-beyond-smatrix.qmd
    - part: part5-semiclassics/part.qmd
      chapters:
        - part5-semiclassics/16-dhn.qmd
        - part5-semiclassics/17-thimbles.qmd
        - part5-semiclassics/18-jordan-chains.qmd
        - part5-semiclassics/19-one-loop-masses.qmd
    - part: part6-soliton-smatrices/part.qmd
      chapters:
        - part6-soliton-smatrices/20-quantum-group-symmetry.qmd
        - part6-soliton-smatrices/21-construction.qmd
        - part6-soliton-smatrices/22-known-smatrices.qmd
        - part6-soliton-smatrices/23-cn-solitons.qmd
        - part6-soliton-smatrices/24-a2n-solitons.qmd
        - part6-soliton-smatrices/25-e6-solitons.qmd
        - part6-soliton-smatrices/26-f4-solitons.qmd
        - part6-soliton-smatrices/27-rsos.qmd
    - part: part7-foundations/part.qmd
      chapters:
        - part7-foundations/28-twelve-gaps.qmd
        - part7-foundations/29-lattice.qmd
        - part7-foundations/30-continuum-thresholds.qmd
        - part7-foundations/31-continuum-window.qmd
        - part7-foundations/32-scattering.qmd
        - part7-foundations/33-outlook.qmd
    - references.qmd
  appendices:
    - appendices/A-algebra-data.qmd
    - appendices/B-numerics.qmd
    - appendices/C-code.qmd

bibliography: references.bib
csl: aps.csl
nocite: |
  @bender2007 @braden1991 @christe1990 @dorey1992 @dorey1993 @gandenberger1998 @ge2012 @johnson1997 @konno1966 @mostafazadeh2010 @osterwalder1973 @osterwalder1975 @zz1979

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [darkly, theme.scss, theme-dark.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    html-math-method: mathjax
    filters:
      - path: status-tags.lua
        at: pre-ast
  pdf:
    documentclass: scrreprt
    classoption: [enabledeprecatedfontcommands]  # math uses \rm, \bf
    toc: true
    toc-depth: 2
    number-sections: true
    filters:
      - path: part-preamble.lua
        at: post-render
    include-in-header:
      text: |
        % Part titles already read "Part I: ...", so drop LaTeX's own part label
        \renewcommand*{\partformat}{}
        \renewcommand*{\addparttocentry}[2]{\addtocentrydefault{part}{}{#2}}
