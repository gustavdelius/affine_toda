project:
  type: book
  post-render:
    - add-backlinks.py
    - add-discovery-metadata.py
  output-dir: _site

book:
  title: "Affine Toda field theory"
  subtitle: "A unified review, with new results"
  editor: Gustav Delius
  description: >-
    An AI-drafted and AI-validated review and research monograph on affine
    Toda field theory, integrable quantum field theory, solitons, quantum
    groups, exact S-matrices and integrable boundaries.
  site-url: https://gustavdelius.github.io/affine_toda/
  open-graph: true
  twitter-card: true
  repo-url: https://github.com/gustavdelius/affine_toda
  output-file: affine-toda
  downloads: [pdf]
  reader-mode: true
  navbar:
    background: primary
  search:
    location: navbar
    type: textbox
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - 01-introduction.qmd
    - part: part1-background/part.qmd
      chapters:
        - part1-background/02-integrable-qft.qmd
        - part1-background/03-sine-gordon.qmd
        - part1-background/04-non-hermitian.qmd
    - part: part2-algebra/part.qmd
      chapters:
        - part2-algebra/05-root-systems.qmd
        - part2-algebra/06-affine-algebras.qmd
        - part2-algebra/07-quantum-groups.qmd
        - part2-algebra/08-r-matrices.qmd
    - part: part3-classical/part.qmd
      chapters:
        - part3-classical/09-lagrangian.qmd
        - part3-classical/10-solitons.qmd
        - part3-classical/11-reality.qmd
    - part: part4-real-coupling/part.qmd
      chapters:
        - part4-real-coupling/12-perturbation-theory.qmd
        - part4-real-coupling/13-simply-laced.qmd
        - part4-real-coupling/14-non-simply-laced.qmd
        - part4-real-coupling/15-beyond-smatrix.qmd
        - part4-real-coupling/16-superalgebra-toda.qmd
    - part: part5-semiclassics/part.qmd
      chapters:
        - part5-semiclassics/17-dhn.qmd
        - part5-semiclassics/18-thimbles.qmd
        - part5-semiclassics/19-jordan-chains.qmd
        - part5-semiclassics/20-one-loop-masses.qmd
    - part: part6-soliton-smatrices/part.qmd
      chapters:
        - part6-soliton-smatrices/21-quantum-group-symmetry.qmd
        - part6-soliton-smatrices/22-construction.qmd
        - part6-soliton-smatrices/23-known-smatrices.qmd
        - part6-soliton-smatrices/24-cn-solitons.qmd
        - part6-soliton-smatrices/25-a2n-solitons.qmd
        - part6-soliton-smatrices/26-e6-solitons.qmd
        - part6-soliton-smatrices/27-f4-solitons.qmd
        - part6-soliton-smatrices/28-rsos.qmd
    - part: part7-half-line/part.qmd
      chapters:
        - part7-half-line/29-boundary-scattering.qmd
        - part7-half-line/30-boundary-sine-gordon.qmd
        - part7-half-line/31-boundary-conditions.qmd
        - part7-half-line/32-half-line-solitons.qmd
        - part7-half-line/33-boundary-quantum-groups.qmd
        - part7-half-line/34-soliton-reflection.qmd
        - part7-half-line/35-quantum-symmetric-pairs.qmd
        - part7-half-line/36-particle-reflection.qmd
    - part: part8-defects/part.qmd
      chapters:
        - part8-defects/37-defect-scattering.qmd
        - part8-defects/38-defect-sine-gordon.qmd
        - part8-defects/39-defect-conditions.qmd
        - part8-defects/40-defect-solitons.qmd
        - part8-defects/41-defect-quantum-groups.qmd
        - part8-defects/42-soliton-transmission.qmd
        - part8-defects/43-defects-and-boundaries.qmd
        - part8-defects/44-particle-transmission.qmd
    - part: part9-foundations/part.qmd
      chapters:
        - part9-foundations/45-twelve-gaps.qmd
        - part9-foundations/46-lattice.qmd
        - part9-foundations/47-continuum-thresholds.qmd
        - part9-foundations/48-continuum-window.qmd
        - part9-foundations/49-scattering.qmd
        - part9-foundations/50-unitarity.qmd
    - outlook/51-outlook.qmd
    - citation.qmd
    - references.qmd
  appendices:
    - appendices/A-algebra-data.qmd
    - appendices/B-numerics.qmd
    - appendices/C-code.qmd
    - appendices/D-corrections.qmd
    - appendices/E-original-results.qmd

bibliography: references.bib
csl: aps.csl
nocite: |
  @*
lang: en-GB

# A DOI will be added here after the first versioned book release is archived.
citation:
  type: book
  title: "Affine Toda field theory: A unified review, with new results"
  editor:
    - given: Gustav
      family: Delius
  issued: 2026
  url: https://gustavdelius.github.io/affine_toda/
  pdf-url: https://gustavdelius.github.io/affine_toda/affine-toda.pdf
  language: en
  abstract: >-
    An AI-drafted and AI-validated review and research monograph covering
    integrable quantum field theory, solitons, quantum groups, exact
    S-matrices, integrable boundaries and the foundations of the
    imaginary-coupling theories.
  keyword: >-
    affine Toda field theory; integrable quantum field theory; solitons;
    quantum groups; exact S-matrices; integrable boundaries; integrable defects;
    non-unitary
appendix-cite-as: false

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [darkly, theme.scss, theme-dark.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    html-math-method: mathjax
    filters:
      - path: status-tags.lua
        at: pre-ast
      - path: hyp-names.lua
      - path: script-links.lua
  pdf:
    documentclass: scrreprt
    classoption: [enabledeprecatedfontcommands]  # math uses \rm, \bf
    toc: true
    toc-depth: 2
    number-sections: true
    filters:
      - path: part-preamble.lua
        at: post-render
      - path: hyp-names.lua
      - path: script-links.lua
    include-in-header:
      text: |
        % Part titles already read "Part I: ...", so drop LaTeX's own part label
        \renewcommand*{\partformat}{}
        \renewcommand*{\addparttocentry}[2]{\addtocentrydefault{part}{}{#2}}

crossref:
  custom:
    - kind: float
      key: hyp
      reference-prefix: Hypothesis
      space-before-numbering: true
      latex-env: hyp
