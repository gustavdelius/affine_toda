project:
  type: book
  post-render:
    - add-backlinks.py
    - add-discovery-metadata.py
  output-dir: _site

book:
  title: "Affine Toda field theory"
  subtitle: "A graduate introduction, leading into current research"
  editor: Gustav Delius
  description: >-
    An AI-drafted graduate textbook and research monograph, with scoped
    subject-matter validation, on affine Toda field theory, integrable quantum
    field theory, solitons, quantum groups, exact S-matrices and integrable
    boundaries.
  site-url: https://gustavdelius.github.io/affine_toda/
  open-graph: true
  twitter-card: true
  repo-url: https://github.com/gustavdelius/affine_toda
  output-file: affine-toda
  downloads: [pdf]
  reader-mode: true
  navbar:
    background: primary
  search:
    location: navbar
    type: textbox
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - part: part1-background/part.qmd
      chapters:
        - part1-background/02-integrable-qft.qmd
        - part1-background/03-sine-gordon.qmd
        - part1-background/04-non-hermitian.qmd
    - part: part2-algebra/part.qmd
      chapters:
        - part2-algebra/05-root-systems.qmd
        - part2-algebra/06-affine-algebras.qmd
        - part2-algebra/07-quantum-groups.qmd
        - part2-algebra/08-r-matrices.qmd
    - part: part3-classical/part.qmd
      chapters:
        - part3-classical/09-lagrangian.qmd
        - part3-classical/10-solitons.qmd
        - part3-classical/11-reality.qmd
    - part: part4-real-coupling/part.qmd
      chapters:
        - part4-real-coupling/12-perturbation-theory.qmd
        - part4-real-coupling/13-simply-laced.qmd
        - part4-real-coupling/14-non-simply-laced.qmd
        - part4-real-coupling/15-beyond-smatrix.qmd
    - part: part5-semiclassics/part.qmd
      chapters:
        - part5-semiclassics/16-dhn.qmd
        - part5-semiclassics/17-thimbles.qmd
        - part5-semiclassics/18-jordan-chains.qmd
        - part5-semiclassics/19-one-loop-masses.qmd
    - part: part6-soliton-smatrices/part.qmd
      chapters:
        - part6-soliton-smatrices/20-quantum-group-symmetry.qmd
        - part6-soliton-smatrices/21-construction.qmd
        - part6-soliton-smatrices/22-known-smatrices.qmd
        - part6-soliton-smatrices/23-cn-solitons.qmd
        - part6-soliton-smatrices/24-a2n-solitons.qmd
        - part6-soliton-smatrices/25-e6-solitons.qmd
        - part6-soliton-smatrices/26-f4-solitons.qmd
        - part6-soliton-smatrices/27-rsos.qmd
    - part: part7-half-line/part.qmd
      chapters:
        - part7-half-line/28-boundary-scattering.qmd
        - part7-half-line/29-boundary-sine-gordon.qmd
        - part7-half-line/30-boundary-conditions.qmd
        - part7-half-line/31-half-line-solitons.qmd
        - part7-half-line/32-boundary-quantum-groups.qmd
        - part7-half-line/33-soliton-reflection.qmd
        - part7-half-line/34-quantum-symmetric-pairs.qmd
        - part7-half-line/35-particle-reflection.qmd
    - part: part8-foundations/part.qmd
      chapters:
        - part8-foundations/36-twelve-gaps.qmd
        - part8-foundations/37-lattice.qmd
        - part8-foundations/38-continuum-thresholds.qmd
        - part8-foundations/39-continuum-window.qmd
        - part8-foundations/40-scattering.qmd
        - part8-foundations/41-unitarity.qmd
    - outlook/42-outlook.qmd
    - citation.qmd
    - references.qmd
  appendices:
    - appendices/A-algebra-data.qmd
    - appendices/B-numerics.qmd
    - appendices/C-code.qmd
    - appendices/D-corrections.qmd

bibliography: references.bib
csl: aps.csl
nocite: |
  @*
lang: en-GB
keywords:
  - affine Toda field theory
  - integrable quantum field theory
  - sine-Gordon theory
  - solitons
  - exact S-matrices
  - quantum groups
  - integrable boundaries
  - non-Hermitian quantum field theory

# A DOI will be added here after the first versioned book release is archived.
citation:
  type: book
  title: "Affine Toda field theory: A graduate introduction, leading into current research"
  editor:
    - given: Gustav
      family: Delius
  issued: 2026
  url: https://gustavdelius.github.io/affine_toda/
  pdf-url: https://gustavdelius.github.io/affine_toda/affine-toda.pdf
  language: en
  abstract: >-
    An AI-drafted graduate textbook and research monograph, with scoped
    subject-matter validation, covering integrable quantum field theory,
    solitons, quantum groups, exact S-matrices, integrable boundaries and the
    foundations of the imaginary-coupling theories.
  keyword: >-
    affine Toda field theory; integrable quantum field theory; solitons;
    quantum groups; exact S-matrices
appendix-cite-as: false

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [darkly, theme.scss, theme-dark.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    html-math-method: mathjax
    filters:
      - path: status-tags.lua
        at: pre-ast
  pdf:
    documentclass: scrreprt
    classoption: [enabledeprecatedfontcommands]  # math uses \rm, \bf
    toc: true
    toc-depth: 2
    number-sections: true
    filters:
      - path: part-preamble.lua
        at: post-render
    include-in-header:
      text: |
        % Part titles already read "Part I: ...", so drop LaTeX's own part label
        \renewcommand*{\partformat}{}
        \renewcommand*{\addparttocentry}[2]{\addtocentrydefault{part}{}{#2}}
