project:
  type: book
  output-dir: _site

book:
  title: "Windows in spacetime"
  subtitle: "Lectures on integrable defects"
  editor: Gustav Delius
  description: >-
    Lecture notes on integrable defects in two-dimensional field theory, a
    companion to Part VIII of the textbook "Affine Toda field theory". They tell
    the story of the ideas and work the key calculations in full.
  site-url: https://gustavdelius.github.io/affine_toda/lectures/defects/
  repo-url: https://github.com/gustavdelius/affine_toda
  reader-mode: true
  navbar:
    background: primary
  search:
    location: navbar
    type: textbox
  sidebar:
    style: docked
  chapters:
    - index.qmd
    - 01-mirrors-and-windows.qmd
    - 02-backlund-machine.qmd
    - 03-freezing.qmd
    - 04-what-gets-through.qmd

bibliography:
  - ../../references.bib
  - references-notes.bib
csl: ../../aps.csl
lang: en-GB

language:
  crossref-ch-prefix: Lecture

format:
  html:
    theme:
      light: [cosmo, ../../theme.scss]
      dark: [darkly, ../../theme.scss, ../../theme-dark.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    html-math-method: mathjax
    filters:
      - path: ../../status-tags.lua
        at: pre-ast
      - path: ../book-links.lua
      - path: ../../script-links.lua
