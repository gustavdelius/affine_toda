name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      # HTML only. The PDF is built locally with publish-pdf.sh, which
      # attaches it to the pdf-latest release.
      - name: Render
        run: quarto render --to html
      # The lecture notes are separate Quarto projects, which the book's render
      # skips. Each lecture-notes/<name>/ is published under lectures/<name>/
      # of the same site.
      - name: Render the lecture notes
        run: |
          mkdir -p _site/lectures
          for dir in lecture-notes/*/; do
            name=$(basename "$dir")
            [ -f "$dir/_quarto.yml" ] || continue
            (cd "$dir" && quarto render --to html)
            rm -rf "_site/lectures/$name"
            cp -r "$dir/_site" "_site/lectures/$name"
          done
      - name: Add the latest PDF
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download pdf-latest --pattern affine-toda.pdf --dir _site \
            || echo "::warning::No pdf-latest release yet, so the PDF download link will 404. Run publish-pdf.sh locally."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
