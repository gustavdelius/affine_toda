name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      # HTML only. The PDF is built by hand with the "Build PDF" workflow
      # (pdf.yml), which attaches it to the pdf-latest release.
      - name: Render
        run: quarto render --to html
      - name: Add the latest PDF
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download pdf-latest --pattern affine-toda.pdf --dir _site \
            || echo "::warning::No pdf-latest release yet, so the PDF download link will 404. Run the Build PDF workflow."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
